name: CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch: {}

jobs:
  # 1. Vérification du Linting (Ruff)
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Ruff
        run: python -m pip install --upgrade pip && pip install ruff
      - name: Run Ruff Check
        run: ruff check .

  # 2. Vérification du Formatage (Black/Ruff)
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Format Tools
        run: python -m pip install --upgrade pip && pip install ruff black
      - name: Check Style
        run: |
          ruff format --check .
          black --check .

  # 3. Vérification de la Sécurité (Bandit)
  security:
    runs-on: ubuntu-latest
    needs: [lint, format, tests]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Bandit
        run: python -m pip install --upgrade pip && pip install bandit
      - name: Run Security Scan
        run: bandit -r src/

  # 4. Tests unitaires et d'intégration
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: 'pip'
      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e ".[dev]"
      - name: Run Pytest
        run: pytest -v --cov=src