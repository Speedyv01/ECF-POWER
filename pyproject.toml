[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ml_filrouge_project"
version = "0.1.0"
description = "Pipeline de prédiction de consommation énergétique"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pandas",
    "scikit-learn",
    "joblib",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-cov",
    "ruff",
    "ipykernel",
    "httpx",
    "requests-mock",
    "pytest",
    "fastapi",
    "requests",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]

[tool.ruff]
line-length = 88
target-version = "py311"
exclude = [
    "ML_DPE_regression/src/preprocessing_mappings.py"
]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "S"]
ignore = ["N803", "N806", "F401", "S101", "N999"]
fixable = ["ALL"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]

[tool.black]
line-length = 88
target-version = ["py311"]

[tool.bandit]
targets = ["src"]
exclude_dirs = ["mon_env", "tests", ".venv", "venv"]
