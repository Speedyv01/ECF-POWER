name: CI Pipeline

on:
  push:
    branches: [ develop ]
  pull_request:
    branches: [ main ]

jobs:
  # 1. Vérification du Linting (Ruff)
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Ruff
        run: pip install ruff==0.8.2
      - name: Run Ruff Check
        run: ruff check . --ignore I001

  # 2. Vérification du Formatage (Black/Ruff)
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Format Tools
        run: pip install ruff==0.8.2 black==24.10.0
      - name: Check Style
        run: |
          ruff format --check .
          black --check .

  # 3. Vérification de la Sécurité (Bandit)
  security:
    runs-on: ubuntu-latest
    needs: [lint, format, tests, structure]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Bandit
        run: pip install bandit
      - name: Run Security Scan
        run: bandit -r api/backend/ api/frontend/ ML_CONSO_regression/src/ ML_DPE_regression/src/

  # 4. Tests unitaires et d'intégration
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: 'pip'
      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest-cov
      - name: Run Pytest
        run: pytest -v api/tests ML_CONSO_regression/tests ML_DPE_regression/tests --cov=api --cov=ML_CONSO_regression --cov=ML_DPE_regression
        env:
          PYTHONPATH: .:ML_CONSO_regression
#5 Test structure
  structure:
    name: Structure Check
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install Test Dependencies
        run: python -m pip install --upgrade pip pytest
      - name: Create Required Directories
        run: |
          mkdir -p ML_CONSO_regression/artifacts/models ML_CONSO_regression/artifacts/metrics
          mkdir -p ML_DPE_regression/artifacts/models ML_DPE_regression/artifacts/metrics     
      - name: Run Structure Test
        run: pytest scripts/test_structure.py
  
# 6. Build des images Docker pour valider la containerisation
  docker-build:
    runs-on: ubuntu-latest
    needs: [security]
    steps:
      - uses: actions/checkout@v4
      - name: Build Backend and Frontend Images
        run: |
          mkdir -p ML_conso_regression/artifacts/models
          touch ML_conso_regression/artifacts/models/conso_model_latest.joblib
          touch ML_DPE_regression/artifacts/models/DPE_model_latest.pkl
          docker build -t power-backend -f api/backend/Dockerfile .
          docker build -t power-frontend -f api/frontend/Dockerfile .


