name: CI Pipeline

on:
  push:
    branches: [ develop ]
  pull_request:
    branches: [ main ]

jobs:
  # 1. Vérification du Linting (Ruff)
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Ruff
        run: pip install ruff==0.8.2
      - name: Run Ruff Check
        run: ruff check . --ignore I001

  # 2. Vérification du Formatage (Black/Ruff)
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Format Tools
        run: pip install ruff==0.8.2 black==24.10.0
      - name: Check Style
        run: |
          ruff format --check .
          black --check .

  # 3. Vérification de la Sécurité (Bandit)
  security:
    runs-on: ubuntu-latest
    needs: [lint, format, tests]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Bandit
        run: pip install bandit
      - name: Run Security Scan
        run: bandit -r api/backend/ api/frontend/ ML_CONSO_regression/src/ ML_DPE_regression/src/

  # 4. Tests unitaires et d'intégration
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: 'pip'
      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest-cov
      - name: Run Pytest
        run: pytest -v api/tests ML_CONSO_regression/tests ML_DPE_regression/tests --cov=api --cov=ML_CONSO_regression --cov=ML_DPE_regression
        env:
          PYTHONPATH: .:ML_CONSO_regression

